<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1d3a" />
  <meta name="description" content="Your class's study space: assignments, study sheets and MCQ practice." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="E-JUST" />
  <title>E-JUST</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="auth" class="auth hidden"></div>

  <div id="shell" class="shell hidden">
    <!-- top bar: only shown on phones/tablets -->
    <header class="topbar">
      <button id="menu-btn" class="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span id="top-title" class="top-title">E-JUST</span>
      <span id="top-timer" class="top-timer hidden"></span>
      <button class="bell-btn" data-bell aria-label="Notifications"><i data-icon="bell"></i><span class="bell-count hidden"></span></button>
    </header>
    <div id="scrim" class="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <button id="menu-close" class="menu-close" aria-label="Close menu">✕</button>
      <div class="brand-row">
        <div class="brand"><span class="brand-logo"><img src="/icons/emblem-64.png" alt=""></span>E-JUST</div>
        <button class="bell-btn side-bell" data-bell aria-label="Notifications"><i data-icon="bell"></i><span class="bell-count hidden"></span></button>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard"><i data-icon="home"></i>Dashboard</a>
        <a href="#/tasks" data-route="tasks"><i data-icon="check"></i>Assignments & Quizzes</a>
        <a href="#/materials" data-route="materials"><i data-icon="file"></i>Study Sheets</a>
        <a href="#/practice" data-route="practice"><i data-icon="target"></i>Practice MCQs</a>
        <a href="#/planner" data-route="planner"><i data-icon="calendar"></i>Planner</a>
        <a href="#/focus" data-route="focus"><i data-icon="clock"></i>Focus Timer</a>
        <a href="#/courses" data-route="courses"><i data-icon="folder"></i>Courses</a>
        <a href="#/notifications" data-route="notifications"><i data-icon="bell"></i>Notifications</a>
        <a href="#/questions" data-route="questions" data-perm="questions" class="hidden"><i data-icon="list"></i>Question Bank</a>
        <a href="#/class" data-route="class" class="admin-only hidden"><i data-icon="users"></i>Class & Sections</a>
        <a href="#/permissions" data-route="permissions" class="admin-only hidden"><i data-icon="lock"></i>Permissions</a>
        <a href="#/connections" data-route="connections" class="admin-only hidden"><i data-icon="link"></i>Connections</a>
      </nav>
      <div class="sidebar-foot">
        <button id="install-btn" class="btn soft small install-btn hidden"><i data-icon="download"></i>Install app</button>
        <div id="timer-mini" class="timer-mini hidden"></div>
        <div id="me" class="me"></div>
        <button id="logout" class="btn ghost small">Sign out</button>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
